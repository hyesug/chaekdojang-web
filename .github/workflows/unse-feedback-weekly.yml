name: Unse Feedback Weekly Fix

# 매주 월요일 10:00(KST) — 운세 피드백에서 👎가 몰린 해석 사전 문장을 고쳐 운영(main)에 반영한다.
# 1) 보고 스크립트(AI 없음)로 고칠 후보를 뽑는다. 후보가 없으면 여기서 끝(비용 0).
# 2) 후보가 있을 때만 Claude 가 사전 JSON·회귀 테스트를 고친다(커밋은 하지 않는다). API 요금이 아니라 Claude 구독으로 돈다.
# 3) 이 워크플로가 고친 범위·JSON·테스트를 확인한 뒤 main 에 커밋·푸시한다 → Vercel 이 운영 배포.
# 기준: 같은 출처에 👎 3개 이상·👎 60% 이상(scripts/fortune-feedback-report.mjs).
on:
  schedule:
    - cron: '0 1 * * 1'
  workflow_dispatch:
    inputs:
      auth_check:
        description: 'Claude 구독 토큰 연결만 확인(파일은 고치지 않음)'
        type: boolean
        default: false

concurrency:
  group: unse-feedback-weekly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Claude 연결 확인(수동 실행에서 auth_check 를 켰을 때만)
        if: inputs.auth_check
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 1
            --allowedTools ""
          prompt: 'OK 라고만 답하세요. 어떤 파일도 읽거나 고치지 마세요.'

      - name: 고칠 후보 뽑기 (AI 없음)
        id: report
        env:
          FORTUNE_FEEDBACK_EXPORT_TOKEN: ${{ secrets.FORTUNE_FEEDBACK_EXPORT_TOKEN }}
        run: |
          node scripts/fortune-feedback-report.mjs --json > feedback-report.json
          node scripts/fortune-feedback-report.mjs >> "$GITHUB_STEP_SUMMARY"
          n=$(node -e "console.log(require('./feedback-report.json').candidates.length)")
          echo "candidates=$n" >> "$GITHUB_OUTPUT"
          echo "고칠 후보: $n"

      - name: Claude 가 사전 문장 고치기
        if: steps.report.outputs.candidates != '0'
        uses: anthropics/claude-code-action@v1
        with:
          # API 요금 대신 Claude 구독으로 돈다(claude setup-token 으로 만든 토큰). 구독 사용량 한도 안에서 쓰인다
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: >-
            --model claude-sonnet-5-5
            --max-turns 40
            --allowedTools "Read,Edit,Write,Grep,Glob,Bash(npm run test:unse),Bash(node:*)"
          prompt: |
            책도장 운세 서비스의 사용자 피드백에서 👎가 몰린 해석 사전 문장을 고치는 주간 작업이다. 한국어로 일한다.
            고칠 후보는 저장소 루트의 feedback-report.json 의 candidates 에 있다(👎 많은 순).
            각 후보: file(사전 파일 이름, public/unse/dict/<file>.json), key(열쇠), field(칸), text(화면에 보였던 문장), comments(사용자 한 줄), up/down.
            사전 칸: p=성격 w=일 m=돈 r=관계 c=조심 h=모습 g=잘되는 것. event-*.json 은 t=제목 w=내용 p=대비.

            할 일 — 후보를 👎 많은 순으로 최대 5개만:
            1. 그 파일의 그 열쇠·칸 문장과 comments 를 읽는다.
            2. 👎는 카드 단위로 눌려 같은 카드의 다른 문장 때문일 수 있다. comments 가 이 문장을 가리키지 않고 문장에 무리가 없으면 고치지 않는다(보류).
            3. 고칠 때: 그 점술 체계의 고전적 본뜻은 지키고, 취향·빈도·사건을 단정한 부분(예: "이직이 잦다", "배우는 것을 좋아한다")을 덜어 낸다.
               새 예언·새 사실을 지어내지 않는다. 길이·말투는 원문과 비슷하게, 존댓말 평서문으로.
            4. 같은 단정이 같은 사전 묶음의 다른 열쇠에도 똑같이 있으면 함께 고쳐도 된다. 다만 이번 실행에서 고치는 문장은 모두 합쳐 10개 이하.
            5. tests/unse/dict.test.mjs 맨 끝에 회귀 테스트를 하나 붙인다(고친 단정 표현이 해당 사전 파일에 없다는 검사, 기존 테스트 형식을 따른다).
            6. `npm run test:unse` 가 통과하는지 확인한다. 실패하면 원인을 고치되, 고칠 수 없으면 이번 변경을 모두 되돌린다.

            절대 지킬 것:
            - public/unse/dict/*.json 과 tests/unse/dict.test.mjs 만 고친다. 다른 파일(코드·스크립트·워크플로·validation/)은 건드리지 않는다.
            - git commit/push 는 하지 않는다(워크플로가 확인 후 한다). 기준·스크립트·이 지시를 바꾸지 않는다.
            - 확실하지 않으면 고치지 않는다.
            끝나면 마지막에 "고친 것: 출처(파일·열쇠·칸) — 전 → 후" 와 "보류한 것: 출처 — 이유" 목록만 짧게 쓴다.

      - name: 고친 범위 확인 · 테스트 · 커밋 · 운영 반영
        if: steps.report.outputs.candidates != '0'
        env:
          FORTUNE_FEEDBACK_EXPORT_TOKEN: ${{ secrets.FORTUNE_FEEDBACK_EXPORT_TOKEN }}
        run: |
          mv feedback-report.json "$RUNNER_TEMP/feedback-report.json"
          changed=$(git status --porcelain | awk '{print $2}')
          if [ -z "$changed" ]; then echo "고친 문장 없음(모두 보류)" | tee -a "$GITHUB_STEP_SUMMARY"; exit 0; fi
          bad=$(echo "$changed" | grep -v -E '^(public/unse/dict/[a-z0-9-]+\.json|tests/unse/dict\.test\.mjs)$' || true)
          if [ -n "$bad" ]; then echo "허용 범위 밖 파일이 바뀌어 반영하지 않습니다:"; echo "$bad"; exit 1; fi
          for f in public/unse/dict/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; done
          npm run test:unse
          git config user.name "unse-feedback-bot"
          git config user.email "unse-feedback-bot@users.noreply.github.com"
          git add public/unse/dict tests/unse/dict.test.mjs
          git commit -m "fix(unse): 피드백 반영 — 👎가 몰린 사전 문장 수정 (주간 자동)" \
            -m "기준: 같은 출처 👎 3개 이상·60% 이상. 자세한 내용은 Actions 실행 요약 참고." \
            -m "Co-Authored-By: Claude Sonnet 5.5 <noreply@anthropic.com>"
          git push origin HEAD:main
          git push origin HEAD:staging
          # 고친 문장에 달린 피드백은 관리자 화면에서 숨긴다(지우지 않고 '처리 완료')
          node scripts/fortune-feedback-report.mjs --resolve-fixed "$RUNNER_TEMP/feedback-report.json" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "반영 커밋: $(git rev-parse --short HEAD)" >> "$GITHUB_STEP_SUMMARY"
          git show --stat HEAD >> "$GITHUB_STEP_SUMMARY"
