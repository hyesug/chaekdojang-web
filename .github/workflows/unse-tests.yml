name: Unse Tests

on:
  push:
    paths:
      - 'public/unse/**'
      - 'tests/unse/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/unse-tests.yml'
  pull_request:
    paths:
      - 'public/unse/**'
      - 'tests/unse/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/unse-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run test:unse
